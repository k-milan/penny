# MySQL (and Adminer) for local development. Laravel/PHP can stay on the host (e.g. Herd):
#   docker compose up -d
#   cp .env.example .env  # if needed, set DB_* from the "Docker MySQL" block in .env.example
#   php artisan migrate
#
# Database is reachable at 127.0.0.1:3307 (host) → 3306 (container) unless you override DB_PORT.

services:
  mysql:
    image: mysql:8.0
    container_name: penny-mysql
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
      MYSQL_DATABASE: "${DB_DATABASE:-penny}"
      MYSQL_USER: "${DB_USERNAME:-penny}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: penny-adminer
    restart: unless-stopped
    ports:
      - "${FORWARD_ADMINER_PORT:-8888}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
