name: Deploy Production

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Pull latest code on server
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd /var/www/penny
            git fetch origin production
            git reset --hard origin/production
            composer install --no-dev --optimize-autoloader
          EOF

      - name: Upload built frontend assets
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" public/build/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/penny/public/build/

      - name: Finalize Laravel deployment
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd /var/www/penny

            php artisan migrate --force

            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan cache:clear

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            sudo chown -R deploy:www-data /var/www/penny
            sudo chmod -R ug+rwx storage bootstrap/cache

            sudo systemctl reload php8.4-fpm
            sudo systemctl reload nginx
          EOF